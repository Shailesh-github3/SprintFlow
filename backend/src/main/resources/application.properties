spring.application.name=sprintflow

sprintflow.jwt.secret=${SPRINGFLOW_JWT_SECRET}
sprintflow.jwt.expiration-ms=${SPRINGFLOW_JWT_EXPIRATION_MS:86400000}
sprintflow.cors.allowed-origins=${SPRINGFLOW_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}
sprintflow.cors.allowed-methods=${SPRINGFLOW_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE}
sprintflow.cors.allowed-headers=${SPRINGFLOW_CORS_ALLOWED_HEADERS:*}
sprintflow.frontend.url=http://localhost:5173

# ============================================================
# Database & Migration Configuration
# ============================================================
# Hibernate DDL auto is disabled. Flyway manages the schema.
# Hibernate is set to 'validate' to check entities match the DB schema at startup.
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sprintflow}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}

# ============================================================
# Flyway Configuration
# ============================================================
# Flyway is enabled and will manage the database schema.
spring.flyway.enabled=true
# Location of migration SQL files (default is classpath:db/migration)
spring.flyway.locations=classpath:db/migration
# Flyway will create the flyway_schema_history table to track migrations.
# If the database is empty, Flyway will run all migrations.
# If the database already has tables, Flyway will detect the baseline.
spring.flyway.baseline-on-migrate=true
# The baseline version for existing databases (defaults to 1)
spring.flyway.baseline-version=1

#EMAIL CONFIGURATION

# Primary Spring Mail Core Properties
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8

# Custom JavaMail Session Properties (SMTP specific)
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Crucial Timeout Settings (Prevents blocked threads)
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# Razorpay API Credentials
razorpay.keyId=${RAZORPAY_KEY_ID:}
razorpay.keySecret=${RAZORPAY_KEY_SECRET}


spring.jpa.properties.hibernate.generate_statistics=true
